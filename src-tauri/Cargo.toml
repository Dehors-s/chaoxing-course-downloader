[package]
name = "chaoxing-downloader"
version = "1.0.0"
description = "学习通课程文件下载器 - 单文件独立版（免安装 Office）"
authors = ["Chaoxing Course Archiver"]
edition = "2021"

[lib]
name = "chaoxing_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
window-vibrancy = "0.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
regex = "1"
scraper = "0.22"

tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "json", "stream"] }

# 纯 Rust 免 Office 本地合成 PDF / PPTX
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = "0.35"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
# 极致单文件瘦身配置：Windows 便携 .exe 约 10~14 MB
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
